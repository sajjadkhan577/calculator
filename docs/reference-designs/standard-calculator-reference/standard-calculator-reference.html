<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Simple Calculator - Premium Digital Interface</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#732ee4",
                        "on-tertiary": "#580063",
                        "surface-bright": "#31394d",
                        "surface-container-highest": "#2d3449",
                        "tertiary-fixed-dim": "#fda9ff",
                        "on-primary-fixed": "#25005a",
                        "on-tertiary-container": "#ffdafb",
                        "primary-container": "#7c3aed",
                        "error-container": "#93000a",
                        "on-secondary-fixed": "#001f26",
                        "outline-variant": "#4a4455",
                        "inverse-on-surface": "#283044",
                        "on-surface": "#dae2fd",
                        "on-primary-fixed-variant": "#5a00c6",
                        "inverse-surface": "#dae2fd",
                        "secondary-fixed-dim": "#4cd7f6",
                        "on-error-container": "#ffdad6",
                        "background": "#0b1326",
                        "on-surface-variant": "#ccc3d8",
                        "surface": "#0b1326",
                        "secondary-container": "#03b5d3",
                        "primary-fixed": "#eaddff",
                        "surface-container-lowest": "#060e20",
                        "surface-container": "#171f33",
                        "primary-fixed-dim": "#d2bbff",
                        "on-tertiary-fixed": "#36003d",
                        "primary": "#d2bbff",
                        "on-tertiary-fixed-variant": "#7d008c",
                        "tertiary": "#fda9ff",
                        "surface-dim": "#0b1326",
                        "outline": "#958da1",
                        "on-error": "#690005",
                        "on-secondary": "#003640",
                        "on-primary-container": "#ede0ff",
                        "secondary-fixed": "#acedff",
                        "on-secondary-container": "#00424e",
                        "secondary": "#4cd7f6",
                        "on-background": "#dae2fd",
                        "error": "#ffb4ab",
                        "surface-variant": "#2d3449",
                        "surface-container-low": "#131b2e",
                        "on-primary": "#3f008e",
                        "tertiary-container": "#b006c4",
                        "surface-container-high": "#222a3d",
                        "on-secondary-fixed-variant": "#004e5c",
                        "surface-tint": "#d2bbff",
                        "tertiary-fixed": "#ffd6fb"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "display-margin-bottom": "2.5rem",
                        "grid-gap": "1rem",
                        "button-size": "4.5rem",
                        "container-padding": "2rem"
                    },
                    "fontFamily": {
                        "display-md": ["Inter"],
                        "button-text": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "display-md": ["48px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "button-text": ["20px", {"lineHeight": "1.0", "fontWeight": "500"}],
                        "display-lg": ["64px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0b1326 40%),
                        radial-gradient(circle at bottom right, #312e81, #0b1326 60%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow-primary {
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
        }
        .neon-glow-secondary {
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.6);
        }
        .button-depth {
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.05), 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="font-inter text-on-surface antialiased">
<!-- Top Navigation Shell -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-slate-950/40 backdrop-blur-lg border-b border-white/10 shadow-[0_0_20px_rgba(124,58,237,0.1)]">
<div class="flex items-center gap-2">
<span class="text-xl font-bold text-white tracking-widest uppercase">Simple Calculator</span>
</div>
<div class="hidden md:flex items-center gap-8">
<nav class="flex items-center gap-6">
<a class="text-violet-400 font-bold text-sm transition-colors duration-200" href="#">Standard</a>
<a class="text-slate-400 hover:bg-white/5 hover:text-white transition-colors duration-200 text-sm px-3 py-1 rounded-lg" href="#">Scientific</a>
<a class="text-slate-400 hover:bg-white/5 hover:text-white transition-colors duration-200 text-sm px-3 py-1 rounded-lg" href="#">Converter</a>
</nav>
</div>
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-slate-400 hover:text-white transition-colors p-2 active:scale-95 duration-200">history</button>
<button class="material-symbols-outlined text-slate-400 hover:text-white transition-colors p-2 active:scale-95 duration-200">settings</button>
<div class="w-10 h-10 rounded-full bg-violet-600/20 border border-violet-500/30 flex items-center justify-center">
<span class="material-symbols-outlined text-violet-400" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</div>
</div>
</header>
<!-- Side Navigation (Web) -->
<aside class="fixed left-0 top-0 h-full w-64 bg-slate-950/80 backdrop-blur-2xl border-r border-white/10 hidden lg:flex flex-col z-40 pt-24 pb-8">
<div class="px-6 mb-8">
<h3 class="text-slate-500 text-xs font-bold uppercase tracking-widest mb-1">Modes</h3>
<p class="text-violet-400 text-xs font-medium">Precision Tools</p>
</div>
<nav class="flex-1 space-y-1">
<a class="bg-violet-600/20 text-violet-300 border-r-2 border-violet-500 px-6 py-3 flex items-center gap-3 transition-all" href="#">
<span class="material-symbols-outlined text-lg">calculate</span>
<span class="font-medium text-sm">Standard</span>
</a>
<a class="text-slate-400 px-6 py-3 flex items-center gap-3 hover:bg-white/5 transition-all" href="#">
<span class="material-symbols-outlined text-lg">science</span>
<span class="font-medium text-sm">Scientific</span>
</a>
<a class="text-slate-400 px-6 py-3 flex items-center gap-3 hover:bg-white/5 transition-all" href="#">
<span class="material-symbols-outlined text-lg">swap_horiz</span>
<span class="font-medium text-sm">Converter</span>
</a>
</nav>
<div class="px-6 mt-auto">
<a class="text-slate-400 py-3 flex items-center gap-3 hover:text-white transition-all" href="#">
<span class="material-symbols-outlined text-lg">dark_mode</span>
<span class="font-medium text-sm">Theme Settings</span>
</a>
</div>
</aside>
<!-- Main Canvas -->
<main class="lg:pl-64 pt-20 min-h-screen flex items-center justify-center px-4 overflow-hidden relative">
<!-- Abstract Background Elements -->
<div class="absolute top-1/4 right-1/4 w-96 h-96 bg-violet-600/20 rounded-full blur-[120px] -z-10"></div>
<div class="absolute bottom-1/4 left-1/4 w-80 h-80 bg-secondary/10 rounded-full blur-[100px] -z-10"></div>
<!-- Calculator Body -->
<div class="w-full max-w-[400px] glass-panel rounded-[24px] p-6 shadow-2xl relative">
<!-- Mode Indicator -->
<div class="flex justify-between items-center mb-6">
<div class="flex gap-1.5">
<div class="w-2 h-2 rounded-full bg-error/60"></div>
<div class="w-2 h-2 rounded-full bg-tertiary/60"></div>
<div class="w-2 h-2 rounded-full bg-secondary/60"></div>
</div>
<span class="font-label-sm text-label-sm text-slate-500 uppercase tracking-widest">Scientific Mode</span>
</div>
<!-- Display Area -->
<div class="relative mb-8 p-6 rounded-2xl bg-slate-950/40 border border-white/5 overflow-hidden group">
<div class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-black/20 to-transparent pointer-events-none"></div>
<div class="text-right flex flex-col justify-end min-h-[140px] relative z-10">
<span class="text-slate-500 text-lg font-medium tracking-tight mb-2">12,450 + 350</span>
<h1 class="font-display-lg text-display-lg text-white tabular-nums drop-shadow-[0_0_10px_rgba(255,255,255,0.1)]">12,800</h1>
</div>
<!-- Cursor Glow -->
<div class="absolute bottom-6 right-4 w-1 h-12 bg-violet-500/40 blur-sm"></div>
</div>
<!-- Buttons Grid -->
<div class="grid grid-cols-4 gap-4">
<!-- Row 1 -->
<button class="h-16 rounded-xl glass-panel text-error font-medium button-depth hover:bg-white/10 active:scale-95 duration-150 flex items-center justify-center">C</button>
<button class="h-16 rounded-xl glass-panel text-slate-300 font-medium button-depth hover:bg-white/10 active:scale-95 duration-150 flex items-center justify-center">
<span class="material-symbols-outlined">exposure</span>
</button>
<button class="h-16 rounded-xl glass-panel text-slate-300 font-medium button-depth hover:bg-white/10 active:scale-95 duration-150 flex items-center justify-center">%</button>
<button class="h-16 rounded-xl glass-panel text-violet-400 font-bold button-depth hover:bg-violet-600/10 active:scale-95 duration-150 flex items-center justify-center neon-glow-primary">
<span class="material-symbols-outlined">horizontal_split</span>
</button>
<!-- Row 2 -->
<button class="h-16 rounded-xl bg-slate-800/40 text-white font-medium button-depth hover:bg-slate-700/50 active:scale-95 duration-150 flex items-center justify-center text-xl">7</button>
<button class="h-16 rounded-xl bg-slate-800/40 text-white font-medium button-depth hover:bg-slate-700/50 active:scale-95 duration-150 flex items-center justify-center text-xl">8</button>
<button class="h-16 rounded-xl bg-slate-800/40 text-white font-medium button-depth hover:bg-slate-700/50 active:scale-95 duration-150 flex items-center justify-center text-xl">9</button>
<button class="h-16 rounded-xl glass-panel text-violet-400 font-bold button-depth hover:bg-violet-600/10 active:scale-95 duration-150 flex items-center justify-center neon-glow-primary">
<span class="material-symbols-outlined">close</span>
</button>
<!-- Row 3 -->
<button class="h-16 rounded-xl bg-slate-800/40 text-white font-medium button-depth hover:bg-slate-700/50 active:scale-95 duration-150 flex items-center justify-center text-xl">4</button>
<button class="h-16 rounded-xl bg-slate-800/40 text-white font-medium button-depth hover:bg-slate-700/50 active:scale-95 duration-150 flex items-center justify-center text-xl">5</button>
<button class="h-16 rounded-xl bg-slate-800/40 text-white font-medium button-depth hover:bg-slate-700/50 active:scale-95 duration-150 flex items-center justify-center text-xl">6</button>
<button class="h-16 rounded-xl glass-panel text-violet-400 font-bold button-depth hover:bg-violet-600/10 active:scale-95 duration-150 flex items-center justify-center neon-glow-primary">
<span class="material-symbols-outlined">remove</span>
</button>
<!-- Row 4 -->
<button class="h-16 rounded-xl bg-slate-800/40 text-white font-medium button-depth hover:bg-slate-700/50 active:scale-95 duration-150 flex items-center justify-center text-xl">1</button>
<button class="h-16 rounded-xl bg-slate-800/40 text-white font-medium button-depth hover:bg-slate-700/50 active:scale-95 duration-150 flex items-center justify-center text-xl">2</button>
<button class="h-16 rounded-xl bg-slate-800/40 text-white font-medium button-depth hover:bg-slate-700/50 active:scale-95 duration-150 flex items-center justify-center text-xl">3</button>
<button class="h-16 rounded-xl glass-panel text-violet-400 font-bold button-depth hover:bg-violet-600/10 active:scale-95 duration-150 flex items-center justify-center neon-glow-primary">
<span class="material-symbols-outlined">add</span>
</button>
<!-- Row 5 -->
<button class="h-16 rounded-xl bg-slate-800/40 text-white font-medium button-depth hover:bg-slate-700/50 active:scale-95 duration-150 flex items-center justify-center text-xl col-span-2 text-left px-8">0</button>
<button class="h-16 rounded-xl bg-slate-800/40 text-white font-medium button-depth hover:bg-slate-700/50 active:scale-95 duration-150 flex items-center justify-center text-xl">.</button>
<button class="h-16 rounded-xl bg-gradient-to-br from-violet-600 to-blue-500 text-white font-bold button-depth active:scale-95 duration-150 flex items-center justify-center neon-glow-secondary group">
<span class="material-symbols-outlined text-2xl transition-transform group-hover:scale-110">equal</span>
</button>
</div>
<!-- Footer Details -->
<div class="mt-8 flex items-center justify-center">
<div class="h-1 w-12 rounded-full bg-white/10"></div>
</div>
</div>
<!-- Float Floating Action Toggle -->
<button class="fixed bottom-8 right-8 w-14 h-14 rounded-full bg-surface-container-high border border-white/10 flex items-center justify-center shadow-xl hover:scale-110 transition-transform active:scale-95 z-50">
<span class="material-symbols-outlined text-violet-400">palette</span>
</button>
</main>
<!-- Bottom Nav (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full bg-slate-950/80 backdrop-blur-xl border-t border-white/5 flex justify-around items-center py-4 px-6 z-50">
<button class="flex flex-col items-center gap-1 text-violet-400">
<span class="material-symbols-outlined">calculate</span>
<span class="text-[10px] uppercase font-bold tracking-tighter">Calc</span>
</button>
<button class="flex flex-col items-center gap-1 text-slate-500">
<span class="material-symbols-outlined">history</span>
<span class="text-[10px] uppercase font-bold tracking-tighter">Logs</span>
</button>
<button class="flex flex-col items-center gap-1 text-slate-500">
<span class="material-symbols-outlined">science</span>
<span class="text-[10px] uppercase font-bold tracking-tighter">Lab</span>
</button>
<button class="flex flex-col items-center gap-1 text-slate-500">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] uppercase font-bold tracking-tighter">Set</span>
</button>
</nav>
</body></html>
