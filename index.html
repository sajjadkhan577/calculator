<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculator</title>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Link to external CSS file (same folder) -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Page wrapper -->
  <div class="wrapper">
    <!-- Calculator -->
    <div class="calc" id="calculator">
      <div class="screen">
        <div id="expr" class="expr"></div>
        <div id="result" class="result">0</div>
      </div>

      <div class="keys">
        <button class="key" data-action="clear">C</button>
        <button class="key" data-action="back">DE</button>
        <button class="key" data-value="%">%</button>
        <button class="key operator" data-value="/">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="*">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="-">-</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key operator" data-value="+">+</button>

        <button class="key wide" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key equal" data-action="equals">=</button>
      </div>
    </div>
  </div>

  <!-- Link to external JS file (same folder) -->
  <script src="script.js"></script>
</body>
</html>
